<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Artem Lascovec">
    <meta name="description" content="Adaptive Site">
    <meta name="keywords" content="Adaptive, site, html, media-query, css">
    <link rel="stylesheet" href="css/style.css">
    <title>Rivo | Main Page</title>
</head>
<body>
    <div class="background">
        <header class="header container">
            <div class="logo">Rivo</div>
            <div class="nav-menu">
                <nav>
                    <a href="#">Home</a>
                    <a href="#">Shop</a>
                    <a href="#">Features</a>
                    <a href="#">contact</a>
                </nav>
                <div class="header-btn">
                    <img src="img/icon/cart.png" alt="Cart">
                    <button>Login</button>
                </div>
            </div>
        </header>
        <div class="hero container">
            <div class="hero-text">
                <h1>Discover and Find Your Own Fashion!</h1>
                <p>Explore our curated collection of stylish clothing and accessories tailored to your unique taste.</p>
                <button>explore now</button>
            </div>
            <div class="hero-img">
                <img src="img/hero-img.png" alt="Hero Image">
            </div>
        </div>
    </div>

</html>
